version: 2
updates:
  # The app uses bun (bun.lock). Dependabot reads it with the "bun" ecosystem.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major versions (React 19, TypeScript 7, Vite 8…) can break the app:
    # they are done by hand on their own branch, never in the weekly batch.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The docs site has its own npm package (docs-site/package-lock.json).
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    groups:
      docs-dependencies:
        patterns:
          - "*"

  # Keeps the versions in .github/workflows current. Every repo has workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
